<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudalite Digital Inc. | Transforming Vision into Reality</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }

        /* Zoom Effect Background */
        .hero-container {
            position: relative;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(15, 23, 42, 0.4), rgba(15, 23, 42, 0.4)), 
                        url('https://images.unsplash.com/photo-1449156001933-468b7bbc2509?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            z-index: -1;
            /* Suble zoom-in animation similar to image_2a23c2.jpg perspective */
            animation: slowZoom 20s infinite alternate ease-in-out;
        }

        @keyframes slowZoom {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }

        .content-overlay { z-index: 10; text-align: center; color: white; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 scroll-smooth">

    <!-- Navigation -->
    <nav class="fixed w-full z-50 bg-white/90 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-6 h-24 flex items-center justify-between">
            <div class="flex items-center">
                <img src="Pixel-Cloud-Logo.png" alt="Cloudalite Digital Inc. Logo" class="h-16 w-auto">
            </div>
            <div class="hidden md:flex gap-8 font-medium text-slate-600">
                <a href="#work" class="hover:text-blue-600 transition">Work</a>
                <a href="#about" class="hover:text-blue-600 transition">About</a>
                <a href="#services" class="hover:text-blue-600 transition">Services</a>
                <a href="#blog" class="hover:text-blue-600 transition">Blog</a>
            </div>
            <a href="#contact" class="bg-slate-900 text-white px-6 py-3 rounded-full font-semibold hover:bg-blue-600 transition">Let's Talk</a>
        </div>
    </nav>

    <!-- Hero Section with Animation -->
    <header class="hero-container">
        <div class="hero-bg"></div>
        <div class="content-overlay px-6 max-w-4xl">
            <h1 class="text-5xl md:text-7xl font-bold mb-6 leading-tight">Transforming Vision into Seamless Digital Reality.</h1>
            <p class="text-lg md:text-2xl text-slate-100 mb-10 font-light leading-relaxed">
                Expertly crafted digital experiences that bridge the gap between ambitious ideas and measurable results for businesses ready to lead.
            </p>
            <div class="flex flex-col md:flex-row gap-4 justify-center">
                <a href="#work" class="bg-white text-slate-900 px-8 py-4 rounded-full font-bold text-lg hover:shadow-xl transition">Explore Our Work</a>
                <a href="#contact" class="bg-transparent border-2 border-white px-8 py-4 rounded-full font-bold text-lg hover:bg-white hover:text-slate-900 transition">Start a Conversation</a>
            </div>
        </div>
    </header>

    <!-- The rest of your Sections (Work, About, Services, Footer) follow here... -->

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
